        股市说白了，就是不断重复以前的走势，很多人只是不愿意接受、不愿意承认而已。

        不管是行情摸到大顶，还是跌出大底，又或者一波题材炒得热火朝天，

        最后走出来的结果，都是大同小异，

        涨的时候疯狂，跌的时候绝望，

        一轮一轮循环。很多人总觉得这次是特殊情况，

        不会走老路，其实万变不离其宗，人性从来没有变过。
