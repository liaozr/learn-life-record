        炒股一直亏钱的人，后来能稳定赚到钱，不是遇到了高人，也不是学了什么厉害的新技术。

        亏多了他才明白，赔钱不是行情不好，是自己管不住手：
        
        没机会时乱买，跌了就割，涨了就追，只有自己慢慢改掉这些毛病，
        
        定下买卖规矩，约束好自己，才能真正稳住盈利，
        
        这条路只能自己熬出来，别人帮不上忙。
